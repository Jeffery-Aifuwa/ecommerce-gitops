apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: store-dev
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: store-ui-svc
            port:
              number: 80
        path: /
        pathType: Exact
status:
  loadBalancer: {}
