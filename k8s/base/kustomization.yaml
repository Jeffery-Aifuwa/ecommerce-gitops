apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - storefront-html.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - catalog-deployment.yaml
  - catalog-service.yaml
  - catalog-hpa.yaml
  - catalog-networkpolicy.yaml
  - catalog-pdb.yaml
  - sealed-secret.yaml
  - catalog-servicemonitor.yaml
  - catalog-alertrule.yaml

configMapGenerator:
  - name: store-config
    literals:
      - STORE_TITLE="Default Store"
      - CATALOG_ENV="base"
