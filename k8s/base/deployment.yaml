apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: store-ui
  name: store-ui
  namespace: store-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-ui
  strategy: {}
  template:
    metadata:
      labels:
        app: store-ui
    spec:
      containers:
      - image: nginx:alpine
        name: nginx
        resources: {}
status: {}
