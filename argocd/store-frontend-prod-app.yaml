apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeffery-Aifuwa/ecommerce-gitops
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: store-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
